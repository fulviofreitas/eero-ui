---
# Codacy configuration.
#
# Local CI is the source of truth for lint, formatting and security:
#   backend/pyproject.toml  — ruff, black, isort (backend-lint job)
#   frontend/package.json   — prettier, eslint, svelte-check (frontend-lint job)
#   .github/workflows/ci.yml — Semgrep (p/python, p/javascript, security-rules/)
# This file keeps Codacy's additional tools from flagging the repository's
# deliberate conventions; every exclusion below states its reason.
#
# Per-engine exclusions are used instead of a global tests exclusion so that
# markdownlint, duplication and file metrics still cover the whole tree.
# Modelled on fulviofreitas/eero-api/.codacy.yml.

exclude_paths:
  - "backend/uv.lock"              # lockfile; Lizard reports it as a source file
  - "frontend/package-lock.json"   # lockfile
  - "graphify-out/**"              # generated knowledge-graph output
  - "metrics.repository.svg"       # generated by metrics.yml
  - "docs/screenshots/**"          # PNG captures + generated README index
  - "frontend/static/fonts/**"     # binary fonts + OFL licence text
  - "frontend/build/**"            # build output (never committed, belt and braces)
  - "frontend/.svelte-kit/**"      # generated

engines:
  # pytest requires bare `assert` (B101) and uses literal placeholder
  # credentials in fixtures (B105/B106). Bandit is meaningful on app/ only.
  bandit:
    exclude_paths:
      - "backend/tests/**"

  # pytest fixture injection shadows module-level fixture names by design
  # (W0621); f-string logging (W1203) is the project's logging style and is
  # covered by ruff's G rules where we want them.
  pylintpython3:
    exclude_paths:
      - "backend/tests/**"

  # Prospector re-runs Bandit (duplicating every B101) and runs pyright in a
  # container without the project's dependencies installed, so every
  # `import fastapi` / `import pydantic` / `import eero` is reported as
  # unresolved, in app/ as well as tests/. Type checking is not part of this
  # repository's toolchain; ruff + the test suite are.
  # `enabled: false` is not honoured by Codacy for this engine (it ran on every
  # file instead), so the exclusion is by path.
  prospector:
    exclude_paths:
      - "backend/**"
      - "scripts/**"

  # Opengrep's Python rules flag `assert` in test modules and its JavaScript
  # audit rules flag the test-only helpers that read source files from disk
  # (security-guards.test.ts, console-log-guard.test.ts) and the MSW fixtures
  # that build HTML strings. Semgrep runs on the real sources in CI.
  opengrep:
    exclude_paths:
      - "backend/tests/**"
      - "frontend/tests/**"
      - "frontend/src/*.test.ts"
      - "frontend/src/**/*.test.ts"

  # Test modules scale with the API surface they cover. scripts/ holds
  # operator tooling (live verification, smoke tests) written as linear,
  # commented procedures on purpose; splitting them into <50-line pieces
  # would hurt the readability the maintainer relies on while a mesh reboots.
  lizard:
    exclude_paths:
      - "backend/tests/**"
      - "scripts/**"
      - "frontend/tests/**"
      - "frontend/src/*.test.ts"
      - "frontend/src/**/*.test.ts"

  # Codacy's default ESLint profile is not this repository's flat config
  # (frontend/eslint.config.js runs in CI); the ESM commitlint config for
  # Node 22 trips its ES5 compatibility rules.
  eslint-8:
    exclude_paths:
      - "commitlint.config.js"
      - "frontend/tests/**"
      - "frontend/src/*.test.ts"
      - "frontend/src/**/*.test.ts"

services:
  eero-ui:
    build: .
    container_name: eero-ui
    ports:
      - "8000:8000"
    volumes:
      # Persist session data and metrics across container restarts
      - eero-data:/data
    environment:
      EERO_DASHBOARD_HOST: "0.0.0.0"
      EERO_DASHBOARD_PORT: "8000"
      EERO_DASHBOARD_DEBUG: "false"
      # REQUIRED: Generate a secure secret with: openssl rand -hex 32
      # Set in .env file or export before running docker-compose
      EERO_DASHBOARD_SESSION_SECRET: "${EERO_DASHBOARD_SESSION_SECRET:?Session secret required - run openssl rand -hex 32}"
      # Metrics collection configuration
      EERO_DASHBOARD_COLLECTION_INTERVAL: "${EERO_DASHBOARD_COLLECTION_INTERVAL:-60}"
      EERO_DASHBOARD_METRICS_RETENTION: "${EERO_DASHBOARD_METRICS_RETENTION:-1y}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------------
  # OPTIONAL — eero-prometheus-exporter (fully decoupled from eero-ui)
  # ------------------------------------------------------------------
  # eero-ui does NOT read from this container in any way: not as a Python
  # dependency, not as a scrape target, not as a data source. eero-ui 6.0+
  # collects and stores its own metrics (see the embedded VictoriaMetrics
  # instance above, written to by eero-ui's own collector).
  #
  # Uncomment this service only if you want the exporter's full 90+ metric
  # set for your OWN external Prometheus to scrape. It needs its own eero
  # credential file (a separate login from eero-ui's) and its own volume;
  # it does not share eero-ui's /data/session.
  #
  # eero-exporter:
  #   image: ghcr.io/fulviofreitas/eero-prometheus-exporter:4.0.0
  #   container_name: eero-exporter
  #   ports:
  #     - "10052:10052"
  #   volumes:
  #     - eero-exporter-session:/data/session
  #   environment:
  #     EERO_EXPORTER_SESSION_FILE: "/data/session/exporter-session.json"
  #     EERO_EXPORTER_HOST: "0.0.0.0"
  #     EERO_EXPORTER_PORT: "10052"
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:10052/ready"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 10s

volumes:
  eero-data:

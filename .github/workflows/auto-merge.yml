# ============================================================================
# 🤖 Auto-Merge Approved PRs
# ============================================================================
# Automatically merges pull requests that are approved and pass all checks.
# Uses the reusable auto-merge action from workflow-arsenal.
#
# How it works:
#   - PRs with the "automerge" label will be merged when ready
#   - PRs are ready when: approved + all required checks pass + up to date
#   - Uses squash merge strategy by default
#
# Trigger strategy:
#   - workflow_run: fires AFTER CI Pipeline completes (primary trigger)
#   - pull_request_review: fires when a review is submitted
#   - pull_request (labeled only): fires when automerge label is added manually
#     after checks have already passed
#
# NOTE: We intentionally exclude pull_request events like opened/synchronize
# because they fire BEFORE CI checks complete, causing premature merges.
# ============================================================================

name: 🤖 Auto-Merge

on:
  workflow_run:
    workflows: ["🧪 CI Pipeline"]
    types:
      - completed
  pull_request_review:
    types:
      - submitted
  pull_request:
    types:
      - labeled
      - unlabeled

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  automerge:
    name: 🤖 Auto-Merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip if CI Pipeline failed (workflow_run trigger)
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🤖 Run automerge
        uses: fulviofreitas/workflow-arsenal/.github/actions/auto-merge@master
        with:
          # Use GitHub App for merging (required for PRs that modify workflow files)
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          app-private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          merge-labels: "automerge"
          blocking-labels: "wip,do-not-merge,needs-review"
          merge-method: "squash"
          required-approvals: "1"

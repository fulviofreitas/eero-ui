# ============================================================================
# 🔄 Renovate - Automated Dependency Updates
# ============================================================================
# Runs Renovate to check for dependency updates and create PRs.
# Uses the reusable renovate action from workflow-arsenal.
#
# Key features:
# - Tracks eero-api and eero-prometheus-exporter dependencies
# - Auto-merges minor/patch updates for most dependencies
# - Requires manual review for major updates
# - Repository caching for faster subsequent runs
#
# Triggers:
# - Scheduled: Every 6 hours (4 times daily)
# - Manual: workflow_dispatch
# - On eero-api release: repository_dispatch
# - On eero-prometheus-exporter release: repository_dispatch
# ============================================================================

name: 🔄 Renovate

on:
  schedule:
    # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "🧪 Dry-run mode (no PRs created)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      log_level:
        description: "📝 Log level"
        required: false
        default: "info"
        type: choice
        options:
          - "debug"
          - "info"
          - "warn"
      reset_cache:
        description: "🗑️ Reset repository cache"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  repository_dispatch:
    types:
      - eero-api-dependency-update-available
      - eero-prometheus-exporter-dependency-update-available

# Prevent concurrent runs
concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ============================================================================
  # 🔄 Run Renovate
  # ============================================================================
  renovate:
    name: 🔄 Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # the arsenal action restores Renovate's cache artifact from earlier runs

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # repository_dispatch payload values are untrusted; they reach the shell through the
      # environment, never through template expansion.
      - name: 📋 Log trigger info
        env:
          SRC_REPO: ${{ github.event.client_payload.repository }}
          SRC_PACKAGE: ${{ github.event.client_payload.package || 'unknown' }}
          SRC_VERSION: ${{ github.event.client_payload.version }}
          SRC_TAG: ${{ github.event.client_payload.tag }}
          SRC_TRIGGERED_BY: ${{ github.event.client_payload.triggered_by || 'unknown' }}
        run: |
          echo "🎯 Trigger: ${GITHUB_EVENT_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            echo "🔗 Source: ${SRC_REPO}"
            echo "📦 Package: ${SRC_PACKAGE}"
            echo "🏷️ Version: ${SRC_VERSION}"
            echo "🔖 Tag: ${SRC_TAG}"
            echo "👤 Triggered by: ${SRC_TRIGGERED_BY}"
          fi

      # ========================================================================
      # ⏳ Wait for PyPI Indexing
      # ========================================================================
      # PyPI indexing typically takes 1-5 minutes after package upload.
      # This step polls PyPI until the new version is available.
      - name: ⏳ Wait for PyPI indexing
        if: github.event_name == 'repository_dispatch'
        uses: fulviofreitas/workflow-arsenal/.github/actions/wait-for-pypi@7fcefdc57681a54229f0ae2c846f13d47e436e19 # v1.0.0
        with:
          package: ${{ github.event.client_payload.package }}
          version: ${{ github.event.client_payload.version }}

      # ========================================================================
      # 🔄 Run Renovate
      # ========================================================================
      - name: 🔄 Run Renovate
        uses: fulviofreitas/workflow-arsenal/.github/actions/renovate@7fcefdc57681a54229f0ae2c846f13d47e436e19 # v1.0.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          app-private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          config-file: ".github/renovate.json5"
          dry-run: ${{ github.event.inputs.dry_run || 'false' }}
          log-level: ${{ github.event.inputs.log_level || 'info' }}
          reset-cache: ${{ github.event.inputs.reset_cache || 'false' }}

      # ========================================================================
      # 📝 Summary
      # ========================================================================
      - name: 📝 Generate summary
        if: always()
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SRC_REPO: ${{ github.event.client_payload.repository || 'unknown' }}
          SRC_PACKAGE: ${{ github.event.client_payload.package || 'unknown' }}
          SRC_VERSION: ${{ github.event.client_payload.version || 'unknown' }}
          SRC_TAG: ${{ github.event.client_payload.tag || 'unknown' }}
          SRC_TRIGGERED_BY: ${{ github.event.client_payload.triggered_by || 'unknown' }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🔄 Renovate Summary

          | Property | Value |
          |:---------|:------|
          | 📦 Repository | [\`${GITHUB_REPOSITORY}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}) |
          | 🎯 Trigger | \`${GITHUB_EVENT_NAME}\` |
          | 🧪 Dry Run | \`${DRY_RUN}\` |

          EOF

          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" << EOF

          ### 📦 Triggered by Dependency Release

          | Property | Value |
          |:---------|:------|
          | 🔗 Source | [\`${SRC_REPO}\`](${GITHUB_SERVER_URL}/${SRC_REPO}) |
          | 📦 Package | \`${SRC_PACKAGE}\` |
          | 🏷️ Version | \`${SRC_VERSION}\` |
          | 🔖 Tag | \`${SRC_TAG}\` |
          | 👤 Triggered by | \`${SRC_TRIGGERED_BY}\` |

          EOF
          fi

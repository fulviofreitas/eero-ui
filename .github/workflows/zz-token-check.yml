# TEMPORARY: proves the ff-renovate App grants the permission set release.yml requestss.
# Read-only API calls only; removed before the PR is merged.
name: 🧪 TEMP App token check

on:
  pull_request:
    branches: [master]

permissions: {}

jobs:
  mint:
    name: 🧪 TEMP mint release token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🔑 Mint with the release.yml permission set
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: 🔎 Read-only call
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}" --jq '.full_name, .permissions'

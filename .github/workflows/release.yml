# ============================================================================
# 🚀 Automated Semantic Release
# ============================================================================
# Automatically creates releases based on conventional commit messages.
# Uses reusable actions from workflow-arsenal for maintainability.
#
# Chain: CI → Release → Docker
# Triggers: After CI Pipeline succeeds on main/master
# ============================================================================

name: 🚀 Release

on:
  # Safe here: the job checks out master, never the triggering run's code, and uses none of its
  # artifacts; it also requires a push to master of this repository, because the branch filter
  # alone matches a fork's pull request from a branch named master.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["🧪 CI Pipeline"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "🧪 Dry-run mode (no actual release)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: release
  cancel-in-progress: false

# The release commit, tag, GitHub release and issue/PR comments are all made with the App
# token, so GITHUB_TOKEN stays read-only.
permissions:
  contents: read

jobs:
  release:
    name: 🚀 Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]') &&
      !contains(github.event.workflow_run.head_commit.message, 'chore(release)'))

    steps:
      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # Push the release commit and tag, create the release, comment on released issues/PRs.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: 🚀 Run semantic-release
        uses: fulviofreitas/workflow-arsenal/.github/actions/semantic-release@7fcefdc57681a54229f0ae2c846f13d47e436e19 # v1.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          dry-run: ${{ github.event.inputs.dry_run || 'false' }}

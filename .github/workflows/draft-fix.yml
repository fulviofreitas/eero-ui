# Delegates to the shared reusable workflow in fulviofreitas/workflow-arsenal.
# This repo is dual-stack (Python backend + TypeScript/JS frontend), so it
# overrides the reusable's Python-only defaults for tests, lint, allowed
# bash tools, and installs both stacks at workflow start.

name: Draft Fix

on:
  issues:
    types: [labeled]

concurrency:
  group: draft-fix-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  draft-fix:
    if: >-
      github.event.label.name == 'try-fix' &&
      github.event.issue.user.type != 'Bot' &&
      github.event.issue.state == 'open'
    uses: fulviofreitas/workflow-arsenal/.github/workflows/agentic-draft-fix.yml@master
    with:
      stack_description: 'TypeScript/JavaScript web UI on top of the eero-api SDK. Docker/Compose/K8s deployment. Frontend: npm test / npm run lint. Backend: pytest / ruff check.'
      test_command: |
        (cd frontend && npm test)
        (cd backend && pytest)
      lint_command: |
        (cd frontend && npm run lint)
        (cd backend && ruff check .)
      allowed_bash_tools: 'git:*,pytest:*,python:*,python3:*,pip:*,uv:*,ruff:*,black:*,mypy:*,npm:*,npx:*,node:*,yarn:*,pnpm:*,tsc:*,eslint:*,prettier:*,ls:*,cat:*,head:*,tail:*,grep:*,find:*,echo:*,mkdir:*,rm:*,mv:*,cp:*'
      frontend_dir: frontend
      backend_dir: backend
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      RENOVATE_APP_ID: ${{ secrets.RENOVATE_APP_ID }}
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

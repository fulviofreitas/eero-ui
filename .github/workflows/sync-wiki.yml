# ============================================================================
# 📚 Sync Wiki
# ============================================================================
# Syncs the wiki/ directory to the GitHub Wiki.
# Uses the reusable wiki-sync action from workflow-arsenal.
# ============================================================================

name: 📚 Sync Wiki

on:
  push:
    branches: [master]
    paths:
      - "wiki/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-wiki:
    name: 📖 Sync Wiki to GitHub Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the wiki-sync action pushes to the wiki repository with GITHUB_TOKEN

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔄 Sync wiki
        uses: fulviofreitas/workflow-arsenal/.github/actions/wiki-sync@7fcefdc57681a54229f0ae2c846f13d47e436e19 # v1.0.0
        with:
          wiki-path: wiki/

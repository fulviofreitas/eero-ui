# ============================================================================
# 🐳 Docker Image Build & Publish
# ============================================================================
# Builds multi-platform Docker images and publishes to GitHub Container Registry.
# Uses reusable workflow from workflow-arsenal for native ARM64 builds.
#
# Chain: CI → Release → Docker
# ============================================================================

name: 🐳 Docker Build & Publish

on:
  # Safe here: the reusable workflow builds this repository at github.sha (master's head for a
  # workflow_run event), never the triggering run's code, and uses none of its artifacts. The
  # Release run that triggers it is itself gated to pushes to master of this repository; the
  # job below also requires the Release run to belong to this repository.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["🚀 Release"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  docker:
    name: 🐳 Docker
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    uses: fulviofreitas/workflow-arsenal/.github/workflows/docker-build.yml@2087aa01c13f842fc566101ceeb9a4a49ec2a370 # master
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      image-name: ghcr.io/${{ github.repository }}
      context: "."
      push: ${{ github.event_name != 'pull_request' }}
      registry: ghcr.io
      registry-username: ${{ github.actor }}
      annotations: |
        org.opencontainers.image.title=eero-ui
        org.opencontainers.image.description=A modern web dashboard for managing eero mesh WiFi networks
        org.opencontainers.image.url=https://github.com/${{ github.repository }}
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/wiki
        org.opencontainers.image.licenses=MIT
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

# ============================================================================
# 🧪 Continuous Integration Pipeline
# ============================================================================
# Chain: Commit Lint → Lint & Format → [Backend Tests ‖ Frontend Tests ‖ Security ‖ Docker] → CI Success
#
# Tests both frontend (Svelte) and backend (FastAPI) components.
# All reusable actions are sourced from fulviofreitas/workflow-arsenal
# ============================================================================

name: 🧪 CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  SEMGREP_RULES_PATH: security-rules
  SARIF_OUTPUT: semgrep.sarif

jobs:
  # ============================================================================
  # 1️⃣ Commit Lint (Gate 1)
  # ============================================================================
  commitlint:
    name: 📝 Commit Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📝 Validate commits
        uses: fulviofreitas/workflow-arsenal/.github/actions/commitlint@master
        with:
          from-sha: ${{ github.event.pull_request.base.sha }}
          to-sha: ${{ github.event.pull_request.head.sha }}

  # ============================================================================
  # 2️⃣ Backend Lint & Format (Gate 2 - depends on Commit Lint)
  # ============================================================================
  backend-lint:
    name: 🐍 Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: commitlint

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: 🐍 Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: 🧹 Run Python lint
        uses: fulviofreitas/workflow-arsenal/.github/actions/python-lint@master
        with:
          src-path: "backend/app/"
          tests-path: "backend/tests/"

  # ============================================================================
  # 2️⃣ Frontend Lint & Type Check (Gate 2 - depends on Commit Lint)
  # ============================================================================
  frontend-lint:
    name: ⚛️ Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: commitlint

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🔍 Run type check & lint
        id: frontend-check
        uses: fulviofreitas/workflow-arsenal/.github/actions/frontend-check@master
        with:
          working-directory: frontend
          node-version: ${{ env.NODE_VERSION }}

      - name: 📊 Add lint results to summary
        if: always()
        working-directory: frontend
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ⚛️ Frontend Lint Results

          EOF

          # Run prettier check and capture output
          echo "### Prettier (Formatting)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npx prettier --check . 2>&1 | tail -5 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Run eslint and capture output
          echo "### ESLint" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npx eslint . 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Run svelte-check and capture output
          echo "### Svelte Check (TypeScript)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npx svelte-check --tsconfig ./tsconfig.json 2>&1 | grep -E "(Error|error|Warning|warning|found)" | tail -10 >> $GITHUB_STEP_SUMMARY || echo "No issues found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # 3️⃣ Backend Tests (Parallel - depends on Backend Lint)
  # ============================================================================
  backend-tests:
    name: 🐍 Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-lint

    env:
      EERO_DASHBOARD_SESSION_SECRET: ci-test-secret-not-for-production-use-only

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: 🐍 Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: 📚 Install dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: 🧪 Run tests
        uses: fulviofreitas/workflow-arsenal/.github/actions/python-test@master
        with:
          working-directory: backend
          test-path: "tests/"
          src-path: "app"
          upload-coverage: "true"
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # 3️⃣ Frontend Tests (Parallel - depends on Frontend Lint)
  # ============================================================================
  frontend-tests:
    name: ⚛️ Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend-lint

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🧪 Run tests
        uses: fulviofreitas/workflow-arsenal/.github/actions/frontend-test@master
        with:
          working-directory: frontend
          node-version: ${{ env.NODE_VERSION }}

  # ============================================================================
  # 3️⃣ Security Scan (Parallel - depends on Commit Lint)
  # ============================================================================
  security-scan:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: commitlint

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🔐 Run Semgrep scan
        uses: fulviofreitas/workflow-arsenal/.github/actions/security-semgrep@master
        with:
          config: "p/python p/javascript ${{ env.SEMGREP_RULES_PATH }}"
          target-path: "."
          sarif-output: ${{ env.SARIF_OUTPUT }}
          fail-on-findings: "true"

  # ============================================================================
  # 3️⃣ Docker Build Test (Parallel - depends on Lint)
  # ============================================================================
  docker-build:
    name: 🐳 Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-lint, frontend-lint]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🐳 Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: eero-ui:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 4️⃣ CI Success Gate (Final - depends on all parallel jobs)
  # ============================================================================
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs: [commitlint, backend-lint, frontend-lint, backend-tests, frontend-tests, security-scan, docker-build]
    if: always()

    steps:
      - name: 🔍 Check all jobs passed
        run: |
          COMMITLINT="${{ needs.commitlint.result }}"
          BACKEND_LINT="${{ needs.backend-lint.result }}"
          FRONTEND_LINT="${{ needs.frontend-lint.result }}"
          BACKEND="${{ needs.backend-tests.result }}"
          FRONTEND="${{ needs.frontend-tests.result }}"
          SECURITY="${{ needs.security-scan.result }}"
          DOCKER="${{ needs.docker-build.result }}"

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🧪 CI Pipeline Summary

          | Stage | Job | Status |
          |:------|:----|:-------|
          | 1️⃣ | 📝 Commit Lint | ${COMMITLINT} |
          | 2️⃣ | 🐍 Backend Lint | ${BACKEND_LINT} |
          | 2️⃣ | ⚛️ Frontend Lint | ${FRONTEND_LINT} |
          | 3️⃣ | 🐍 Backend Tests | ${BACKEND} |
          | 3️⃣ | ⚛️ Frontend Tests | ${FRONTEND} |
          | 3️⃣ | 🔐 Security Scan | ${SECURITY} |
          | 3️⃣ | 🐳 Docker Build | ${DOCKER} |

          EOF

          # All jobs are required to pass
          if [[ "$COMMITLINT" == "success" && "$BACKEND_LINT" == "success" && "$FRONTEND_LINT" == "success" && "$BACKEND" == "success" && "$FRONTEND" == "success" && "$SECURITY" == "success" && "$DOCKER" == "success" ]]; then
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'

          > [!NOTE]
          > ### ✅ All Required Checks Passed
          > CI pipeline completed successfully. Ready for release!

          ---

          ```
          1️⃣ 📝 Commit Lint
                 ↓
               ┌─┴────────────┐
          2️⃣   │              │
          🐍 Backend Lint  ⚛️ Frontend Lint
               │              │
               ↓              ↓
               ┌─┴────────────┼──────────┬─────────┐
          3️⃣   │              │          │         │
          🐍 Backend Tests ⚛️ Frontend  🔐 Sec  🐳 Docker
               └─┬────────────┴──────────┴─────────┘
                 ↓
          4️⃣ ✅ CI Success → 🚀 Release
          ```

          EOF
            exit 0
          else
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'

          > [!CAUTION]
          > ### ❌ Some Required Checks Failed
          > Review the failed jobs above and fix any issues before merging.

          EOF
            exit 1
          fi

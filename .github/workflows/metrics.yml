name: 📊 Repository Metrics

on:
  # Generate on schedule (daily at 00:00 UTC)
  schedule:
    - cron: "0 0 * * *"
  # Generate on push to master
  push:
    branches:
      - master
    paths:
      - ".github/workflows/metrics.yml"
  # Allow manual trigger
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  metrics:
    # The callee commits the SVG with the App token; GITHUB_TOKEN only needs to read.
    permissions:
      contents: read
    uses: fulviofreitas/workflow-arsenal/.github/workflows/reusable-metrics.yml@c62cf10d0a378d6308b62a40677b3dabfc83808b # master
    with:
      repo: eero-ui
      branch: master
    secrets:
      RENOVATE_APP_ID: ${{ secrets.RENOVATE_APP_ID }}
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
